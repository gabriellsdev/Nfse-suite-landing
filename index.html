<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFSe Nacional Suite — Coleta em Lote e Gestão de NFS-e</title>
    <meta name="description" content="Automatize a coleta em lote de NFS-e no Ambiente de Dados Nacional (ADN) com certificado digital A1/A3. PDFs DANFSe agrupados e planilhas Excel." />
    <link rel="canonical" href="https://nfsesuite.com.br/" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Performance: Preconnect to Release API -->
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.github.com" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nfsesuite.com.br/" />
    <meta property="og:title" content="NFSe Nacional Suite — Coleta em Lote e Gestão de NFS-e" />
    <meta property="og:description" content="Automatize a coleta em lote de NFS-e no Ambiente de Dados Nacional (ADN) com certificado digital A1/A3. PDFs DANFSe agrupados e planilhas Excel." />
    <meta property="og:image" content="https://nfsesuite.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="NFSe Nacional Suite" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nfsesuite.com.br/" />
    <meta name="twitter:title" content="NFSe Nacional Suite — Coleta em Lote e Gestão de NFS-e" />
    <meta name="twitter:description" content="Automatize a coleta em lote de NFS-e no Ambiente de Dados Nacional (ADN) com certificado digital A1/A3. PDFs DANFSe agrupados e planilhas Excel." />
    <meta name="twitter:image" content="https://nfsesuite.com.br/og-image.png" />

    <!-- Force HTTPS Fallback -->
    <script>
      if (window.location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(window.location.hostname)) {
        window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
